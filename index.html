<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Winchester Bins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />

  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <meta name="theme-color" content="#000000" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 class="app-title">WINCHESTER BINS</h1>
      <p class="app-date" id="today-label"></p>
      <p class="app-countdown" id="countdown-label"></p>
      <div class="notif-pill">
        <span class="notif-dot"></span>
        <span>Notifications On</span>
      </div>
    </header>

    <section class="card" id="next-card">
      <p class="card-label">Next collection</p>
      <h2 class="next-type" id="next-type">–</h2>
      <p class="next-date" id="next-date">–</p>

      <div class="next-bin-row">
        <div id="next-bin-icon"></div>
        <p class="next-bin-text" id="next-bin-text"></p>
      </div>

      <button class="btn-primary" id="mark-collected-btn">
        Mark as Collected
      </button>
      <button class="btn-secondary" id="undo-btn" hidden>
        Undo
      </button>
      <p class="last-collected" id="last-collected-label"></p>
    </section>

    <section class="card">
      <h2 class="section-title">Upcoming collections</h2>
      <div id="upcoming-list"></div>
    </section>

    <section class="card">
      <h2 class="section-title">Notification settings</h2>

      <div class="setting-row">
        <div>
          <div class="setting-title">Daily countdown (11pm)</div>
          <div class="setting-sub">
            “Bins in X days” from 7 days before
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-daily" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <div>
          <div class="setting-title">Strong reminders</div>
          <div class="setting-sub">
            Day before 7pm, day of 7am & 10am
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-strong" />
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="card">
      <h2 class="section-title">Bin colour key</h2>
      <div class="bin-row">
        <div class="bin-icon bin-food"></div>
        <span>Food Waste</span>
      </div>
      <div class="bin-row">
        <div class="bin-icon bin-recycling"></div>
        <span>Recycling</span>
      </div>
      <div class="bin-row">
        <div class="bin-icon bin-glass"></div>
        <span>Glass</span>
      </div>
      <div class="bin-row">
        <div class="bin-icon bin-general"></div>
        <span>General Waste</span>
      </div>
      <div class="bin-row">
        <div class="bin-icon bin-garden"></div>
        <span>Garden Waste</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
