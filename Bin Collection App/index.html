<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA Requirements -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4CAF50" />

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

    <title>Bin Collection</title>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="assets/css/colours.css" />
</head>

<body>

    <header>
        <h1>Next Bin Collection</h1>
        <p id="address">19 Rotherley Gardens, Winchester</p>
    </header>

    <main>

        <!-- Countdown -->
        <section id="countdown-section">
            <h2>Countdown</h2>
            <div id="countdown" class="countdown-box">Loading…</div>
        </section>

        <!-- Next Collection Info -->
        <section id="next-collection-section">
            <h2>Upcoming Collection</h2>
            <div id="collection-info" class="collection-box">
                Loading…
            </div>
        </section>

        <!-- Mark as Collected -->
        <section id="actions-section">
            <button id="mark-collected-btn" class="action-btn">Mark as Collected</button>
            <button id="undo-btn" class="undo-btn hidden">Undo</button>
        </section>

    </main>

    <footer>
        <p>Bin Collection PWA</p>
    </footer>

    <!-- Main App Script -->
    <script type="module" src="app.js"></script>

</body>
</html>
